<style>
:root{
  --red:#D62828; --red-dk:#A81C1C; --red-soft:#FCE6E4;
  --yel:#F7B500; --yel-soft:#FFF4CF; --yel-ink:#7A5600;
  --ink:#171514; --ink-2:#2A2624; --muted:#6E6762; --line:#E4DED6;
  --bg:#F5F2ED; --surface:#FFFFFF; --surface-2:#FAF8F5;
  --ok:#1E7A46; --ok-soft:#E2F3E8; --blue:#1F5FA8; --blue-soft:#E3EDF9;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-b:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --sh:0 1px 2px rgba(23,21,20,.06),0 4px 14px rgba(23,21,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-d);letter-spacing:.2px;margin:0}
.hide{display:none!important}
/* ---------- layout ---------- */
#app{display:flex;min-height:100%}
#side{width:248px;flex:none;background:var(--ink);color:#d8d2cc;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
#side .brand img{width:52px;height:52px;border-radius:10px;background:#fff;object-fit:contain}
#side .brand b{font-family:var(--f-d);font-size:19px;color:#fff;line-height:1.05;display:block}
#side .brand small{color:#9b938c;font-size:12px}
#side nav{padding:6px 8px 20px}
#side .grp{font-family:var(--f-d);font-size:13px;font-weight:700;letter-spacing:1.4px;color:#F26419;padding:16px 10px 6px;text-transform:uppercase;border-top:1px solid #2a2624;margin-top:6px}
#side nav .grp:first-child{border-top:0;margin-top:0}
#side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:9px;color:#e8e2dc;text-decoration:none;font-weight:500}
#side a:hover{background:#2a2624}
#side a.on{background:var(--red);color:#fff}
#side a.off{color:#7d756f;pointer-events:none}
#side a .tag{font-size:10px;font-weight:700;letter-spacing:.6px;background:#2f2a27;color:#a69e97;border-radius:5px;padding:2px 6px;text-transform:uppercase}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:58px}
#top .ttl{font-family:var(--f-d);font-size:22px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .who{font-size:13px;color:var(--muted);text-align:right;line-height:1.2}
#top .who b{color:var(--ink);display:block;font-size:14px}
#menuBtn{display:none}
#view{padding:18px;max-width:1280px;width:100%}
.demo-bar{background:var(--yel);color:#3d2b00;font-size:13px;font-weight:600;text-align:center;padding:5px 10px}
/* garçom: tela cheia, sem menu */
body.garcom #side,body.garcom #menuBtn{display:none!important}
body:not(.garcom) #topLogo{display:none}
#topLogo{width:38px;height:38px;border-radius:9px;background:#fff;object-fit:contain}
body.garcom #view{padding:12px;max-width:760px;margin:0 auto}
body.garcom #top{background:var(--red);color:#fff;border:0}
body.garcom #top .who,body.garcom #top .who b{color:#fff}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s}
  #side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #menuBtn{display:inline-flex}
  #view{padding:12px}
  #top{padding:8px 12px}
}
/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px;white-space:nowrap}
.btn:hover{border-color:#cfc7bd}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-dk)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.yel{background:var(--yel);border-color:var(--yel);color:#2b1f00}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.lg{min-height:52px;font-size:17px;padding:12px 18px}
.btn.blk{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--red);border-color:#f1c9c5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.chip.livre{background:#EEEAE4;color:#5d5650}
.chip.aberta{background:var(--yel-soft);color:var(--yel-ink)}
.chip.conta{background:var(--red-soft);color:var(--red-dk)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.err{background:var(--red-soft);color:var(--red-dk)}
.chip.info{background:var(--blue-soft);color:var(--blue)}
.chip.neu{background:#EEEAE4;color:#5d5650}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;font-size:15px;color:var(--ink);font-weight:500}
label.f input:focus,label.f select:focus,label.f textarea:focus,.inp:focus{outline:2px solid var(--yel);border-color:var(--yel)}
.inp{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-size:15px;min-height:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-family:var(--f-d);font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid #EFEAE3;vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr.cat td{background:#F3EFE9;font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:.4px}
.tw{overflow:auto}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.kpi b{display:block;font-family:var(--f-d);font-size:28px;margin-top:2px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:21px;flex:1}
/* ---------- mesas ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.mesa{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 10px 9px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh)}
.mesa .n{font-family:var(--f-d);font-size:30px;font-weight:800;line-height:1}
.mesa .n small{font-size:12px;font-weight:600;color:var(--muted);display:block;letter-spacing:1px}
.mesa .v{font-weight:700;font-size:14px}
.mesa .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mesa.aberta{background:var(--yel-soft);border-color:#F2D27A}
.mesa.conta{background:var(--red);border-color:var(--red);color:#fff}
.mesa.conta .m,.mesa.conta .n small{color:#ffe1dd}
.mesa:active{transform:scale(.98)}
@media (max-width:640px){.mesas{grid-template-columns:repeat(4,1fr);gap:8px}.mesa{min-height:78px;padding:8px}.mesa .n{font-size:24px}.mesa .v{font-size:12px}.mesa .m{display:none}}
@media (max-width:360px){.mesas{grid-template-columns:repeat(3,1fr)}}
/* ---------- comanda ---------- */
.cmd-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cmd-h h2{font-size:30px;font-weight:800;line-height:1}
.cmd-acts{display:flex;gap:8px;flex-wrap:wrap}
.it{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid #EFEAE3;align-items:flex-start}
.it:last-child{border-bottom:0}
.it .q{font-family:var(--f-d);font-weight:800;font-size:20px;min-width:34px}
.it .d{flex:1;min-width:0}
.it .d b{display:block;font-weight:600}
.it .d .x{font-size:13px;color:var(--muted)}
.it .d .o{font-size:13px;color:var(--red-dk);font-weight:600}
.it .v{font-weight:700;white-space:nowrap;text-align:right}
.it.cancel{opacity:.55}
.it.cancel .d b{text-decoration:line-through}
.envio-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;padding:9px 14px 5px;background:var(--surface-2);border-bottom:1px solid #EFEAE3}
.tot{padding:12px 14px;border-top:1px solid var(--line)}
.tot .l{display:flex;justify-content:space-between;padding:2px 0}
.tot .l.big{font-family:var(--f-d);font-size:24px;font-weight:800;margin-top:4px}
.cmd-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:980px){.cmd-grid{grid-template-columns:1fr}}
/* ---------- catálogo ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;position:sticky;top:58px;background:var(--bg);z-index:5}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.cats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:58px}
.prod b{font-weight:600;display:block}
.prod small{color:var(--muted);font-size:12px}
.prod .p{font-weight:700;white-space:nowrap}
.prod .qbadge{background:var(--red);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:2px 8px;margin-left:6px}
.cartbar{position:sticky;bottom:0;z-index:15;margin:14px -18px -18px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
body.garcom .cartbar{margin:14px -12px -12px;padding-left:12px;padding-right:12px}
@media (max-width:900px){.cartbar{margin:14px -12px -12px;padding-left:12px;padding-right:12px}}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:80;background:rgba(23,21,20,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal .box.wide{max-width:760px}
#modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
#modal .mh h3{font-size:22px;flex:1}
#modal .mb{padding:16px}
#modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
@media (max-width:640px){#modal{align-items:flex-end;padding:0}#modal .box{border-radius:18px 18px 0 0;max-height:92vh}#modal .mf{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.stepper button{width:52px;height:48px;border:0;background:var(--surface-2);font-size:24px;font-weight:700}
.stepper span{min-width:56px;text-align:center;font-family:var(--f-d);font-size:26px;font-weight:800}
.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #EFEAE3}
.opt input{width:20px;height:20px;accent-color:var(--red)}
.adq.on{background:var(--yel-soft)}
.mini{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.mini button{width:40px;height:38px;border:0;background:var(--surface-2);font-size:20px;font-weight:700}
.mini button:disabled{opacity:.35}
.mini span{min-width:30px;text-align:center;font-family:var(--f-d);font-size:20px;font-weight:800}
.opt span{flex:1}
.paper{background:#fff;border:1px dashed #cfc7bd;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.35;padding:14px 12px;width:max-content;max-width:100%;margin:0 auto;white-space:pre;overflow:auto;color:#111}
.paper .g{font-size:19px;font-weight:800;line-height:1.25}
.paper .b{font-weight:800}
table.dre td,table.dre th{white-space:nowrap;font-size:13px;padding:7px 8px}
table.dre td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px}
table.dre tr.res td{font-weight:800;background:#F3EFE9;font-family:var(--f-d);font-size:15px}
table.dre tr.res td:first-child{background:#F3EFE9}
table.dre tr.big td{background:var(--yel-soft);font-size:17px}
table.dre tr.big td:first-child{background:var(--yel-soft)}
table.dre tr.sec td{font-weight:600}
table.dre tr.grp td{font-weight:600;color:var(--ink-2)}
table.dre tr.cta td{color:var(--muted)}
table.dre td.dr{cursor:pointer}
table.dre td.dr:hover{background:var(--yel-soft);text-decoration:underline}
.pay{display:grid;grid-template-columns:1fr 130px 36px;gap:8px;margin-bottom:8px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast div.err{background:var(--red)}
/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#171514 0%,#2a2624 55%,#D62828 140%)}
#login .box{background:#fff;border-radius:18px;padding:26px 24px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#login .lg{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;text-align:center}
#login .lg img{width:120px;height:120px;object-fit:contain}
#login .lg h1{font-size:26px}
#login .lg small{color:var(--muted)}
.persona{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.persona b{display:block}
.persona small{color:var(--muted)}
.persona .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:800;font-size:18px;color:#fff;background:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.on{background:#26a65b}.dot.off{background:var(--red)}
#printHead{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{background:#fff!important}
  #side,#top,#demoBar,#toast,#modal,.no-print,.cartbar,.sec-h select,.sec-h input,.sec-h .btn,.sec-h label,td .btn,th:empty{display:none!important}
  #app,#main{display:block}
  #view{padding:0!important;max-width:none!important}
  #printHead{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #171514;padding-bottom:8px;margin-bottom:12px}
  #printHead img{width:46px;height:46px;object-fit:contain}
  #printHead b{font-family:var(--f-d);font-size:20px;display:block}
  #printHead small{color:#555;font-size:11px}
  .card{box-shadow:none!important;border-color:#ccc!important;break-inside:auto}
  .tw,.card.tw{max-height:none!important;overflow:visible!important}
  table.t{font-size:10px}
  table.t th,table.t td{padding:4px 5px!important}
  table.dre td:first-child{position:static!important;min-width:0!important}
  tr{break-inside:avoid}
  .kpis{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
  .kpi{padding:6px 10px!important}.kpi b{font-size:16px!important}
  .chip{border:1px solid #bbb}
  a{color:inherit;text-decoration:none}
}
</style>
</head>

function num(v){ if (typeof v === 'number') return v; let s = String(v ?? '').trim().replace(/[R$\s]/g,''); if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isNaN(n) ? 0 : n; }
function diaStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function diaOp(d = new Date()){ const x = new Date(d); if (x.getHours() < (+G().virada || 0)) x.setDate(x.getDate() - 1); return diaStr(x); }
const hora = iso => { if (!iso) return ''; const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dataHora = iso => { if (!iso) return ''; const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dataBR = s => s ? s.split('-').reverse().join('/') : '';
const minDesde = iso => Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
const tempo = iso => { const m = minDesde(iso); return m < 60 ? m + ' min' : Math.floor(m/60) + 'h' + pad(m%60); };
const limpa = o => JSON.parse(JSON.stringify(o));
const fone = s => { const d = String(s||'').replace(/\D/g,''); if (/^0[3589]00/.test(d) && d.length === 11) return `${d.slice(0,4)} ${d.slice(4,7)} ${d.slice(7)}`; if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return s || ''; };

/* ============================ STORE DEMO ============================= */
function casa(d, w){ return (w || []).every(([f, op, v]) => { const x = d[f]; switch (op) { case '==': return x === v; case '!=': return x !== v; case 'in': return v.includes(x); case '>=': return x >= v; case '<=': return x <= v; case '<': return x < v; case '>': return x > v; } return true; }); }
function fundo(a, b){ for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) fundo(a[k], b[k]); else a[k] = b[k]; } return a; }
function storeDemo(){
  const K = c => 'epo_demo_' + c;
  const ch = ('BroadcastChannel' in window) ? new BroadcastChannel('epo-demo') : null;
  const subs = new Set();
  const all = c => { try { return JSON.parse(localStorage.getItem(K(c)) || '{}'); } catch { return {}; } };
  const put = (c, m) => localStorage.setItem(K(c), JSON.stringify(m));
  const run = s => { const m = all(s.col); if (s.id) s.cb(m[s.id] ? Object.assign({}, m[s.id], {id:s.id}) : null); else s.cb(Object.entries(m).map(([id, d]) => Object.assign({}, d, {id})).filter(d => casa(d, s.w))); };
  const emit = cols => subs.forEach(s => cols.includes(s.col) && run(s));
  if (ch) ch.onmessage = e => emit(e.data);
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith('epo_demo_')) emit([e.key.slice(9)]); });
  return {
    listen(col, w, cb){ const s = {col, w, cb}; subs.add(s); setTimeout(() => run(s)); return () => subs.delete(s); },
    listenDoc(col, id, cb){ const s = {col, id, cb}; subs.add(s); setTimeout(() => run(s)); return () => subs.delete(s); },
    async get(col, w){ return Object.entries(all(col)).map(([id, d]) => Object.assign({}, d, {id})).filter(d => casa(d, w)); },
    async getDoc(col, id){ const m = all(col); return m[id] ? Object.assign({}, m[id], {id}) : null; },
    async batch(ops){ const cols = [...new Set(ops.map(o => o.col))]; const mm = {}; cols.forEach(c => mm[c] = all(c));
      ops.forEach(o => { const m = mm[o.col]; const d = o.data ? limpa(o.data) : null; if (d) delete d.id;
        if (o.op === 'set') m[o.id] = d; else if (o.op === 'update') m[o.id] = fundo(m[o.id] || {}, d); else if (o.op === 'del') delete m[o.id];
        else if (o.op === 'inc') { const x = m[o.id] = fundo(m[o.id] || {}, d || {}); Object.entries(o.inc || {}).forEach(([path, n]) => { const ks = path.split('.'); let t = x; ks.slice(0, -1).forEach(k => t = t[k] = t[k] || {}); const l = ks[ks.length - 1]; t[l] = Math.round(((+t[l] || 0) + n) * 100) / 100; }); } });
      cols.forEach(c => put(c, mm[c])); emit(cols); if (ch) ch.postMessage(cols); },
    async contador(nome){ const m = all('config'); const c = m.contadores || {}; c[nome] = (c[nome] || 0) + 1; m.contadores = c; put('config', m); return c[nome]; }
  };
}

/* ============================ STORE NUVEM ============================ */
function storeNuvem(){
  const {D, db} = FB;
  const q = (col, w) => (w && w.length) ? D.query(D.collection(db, col), ...w.map(([f, o, v]) => D.where(f, o, v))) : D.collection(db, col);
  const docs = s => s.docs.map(d => Object.assign({}, d.data(), {id:d.id}));
  return {
    listen(col, w, cb){ return D.onSnapshot(q(col, w), s => cb(docs(s)), e => { console.error(col, e); toast('Sem permissão ou sem conexão: ' + col, 1); }); },
    listenDoc(col, id, cb){ return D.onSnapshot(D.doc(db, col, id), s => cb(s.exists() ? Object.assign({}, s.data(), {id}) : null), e => console.error(col, id, e)); },
    async get(col, w){ return docs(await D.getDocs(q(col, w))); },
    async getDoc(col, id){ const s = await D.getDoc(D.doc(db, col, id)); return s.exists() ? Object.assign({}, s.data(), {id}) : null; },
    async batch(ops){ for (let i = 0; i < ops.length; i += 450) { const b = D.writeBatch(db);
        ops.slice(i, i + 450).forEach(o => { const r = D.doc(db, o.col, o.id); const d = o.data ? limpa(o.data) : null; if (d) delete d.id;
          if (o.op === 'set') b.set(r, d); else if (o.op === 'update') b.set(r, d, {merge:true}); else if (o.op === 'del') b.delete(r);
          else if (o.op === 'inc') { const x = d || {}; Object.entries(o.inc || {}).forEach(([path, n]) => { const ks = path.split('.'); let t = x; ks.slice(0, -1).forEach(k => t = t[k] = t[k] || {}); t[ks[ks.length - 1]] = D.increment(n); }); b.set(r, x, {merge:true}); } });
        await b.commit(); } },
    async contador(nome){ const r = D.doc(db, 'config', 'contadores'); return D.runTransaction(db, async t => { const s = await t.get(r); const n = ((s.exists() && s.data()[nome]) || 0) + 1; t.set(r, {[nome]:n}, {merge:true}); return n; }); }
  };
}
/* grava sem travar a tela quando o celular está sem internet (o Firebase sincroniza depois) */
async function gravar(ops, msgOk){
  const p = ST.batch(ops);
  p.catch(e => { console.error(e); toast('Erro ao gravar: ' + (e.code || e.message), 1); });
  const r = await Promise.race([p.then(() => 'ok'), sleep(1800).then(() => 'pendente')]);
  if (msgOk) toast(r === 'ok' ? msgOk : msgOk + ' (sincronizando…)');
  return r;
}

function prodsOrdenados(){ const cats = catsLista(); return S.produtos.filter(p => p.ativo !== false).sort((a, b) => (cats.indexOf(a.categoria) - cats.indexOf(b.categoria)) || ((+a.ordem || 0) - (+b.ordem || 0)) || a.nome.localeCompare(b.nome)); }

function job(destino, tipo, ref, linhas, envio){ const id = uid(); return {op:'set', col:'impressoes', id, data:{destino, tipo, ref, linhas, envio:envio || null, status:'pendente', criadoEm:agora(), dia:diaOp(), tentativas:0, por:U.nome}}; }
async function enviar(){
  const key = cartKey(); const cart = CART[key] || []; if (!cart.length) return;
  let c = cmdAtual(); const ops = [];
  if (!c) { const mesa = V.p.mesa; c = cmdMesa(mesa);
    if (!c) { c = {id:uid(), tipo:'mesa', mesa, status:'aberta', abertaEm:agora(), dia:diaOp(), abertaPor:U.nome, garcom:U.nome}; ops.push({op:'set', col:'comandas', id:c.id, data:c}); } }
  const envio = uid(), ts = agora();
  const its = cart.map(x => Object.assign({id:uid(), comandaId:c.id, ref:REF(c), ativa:true, status:'ativo', garcom:U.nome, lancadoEm:ts, envio}, x));
  its.forEach(i => ops.push({op:'set', col:'itens', id:i.id, data:i}));
  ['cozinha', 'copa'].forEach(d => { const l = its.filter(i => i.destino === d); if (l.length) ops.push(job(d, 'producao', REF(c), tkProducao(c, l, d), envio)); });
  if (c.tipo !== 'mesa') ops.push(job('tele', 'tele', REF(c), tkTele(c, [...ativos(c.id), ...its], itensDe(c.id).length > 0), envio));
  if (c.status === 'conta') ops.push({op:'update', col:'comandas', id:c.id, data:{status:'aberta'}});
  CART[key] = []; delete CART['mesa:' + V.p.mesa];
  V = {view:'comanda', p:{id:c.id, tipo:c.tipo}};
  await gravar(ops, 'Pedido enviado');
  render();
}

/* ------------------------------ tickets ------------------------------ */
/* Linhas: {a:'c'|'l'|'r', s, b, g} texto · {kv:[esq,dir], b, g} · {hr:1} · {feed:n} — o programa de impressão converte para ESC/POS */
const Lc = (s, o = {}) => Object.assign({a:'c', s}, o), Ll = (s, o = {}) => Object.assign({a:'l', s}, o), KV = (l, r, o = {}) => Object.assign({kv:[l, r]}, o), HR = {hr:1};
function tkProducao(c, its, dest){
  const L = [Lc(DESTINOS[dest].toUpperCase(), {b:1}), Lc(REF(c), {g:1, b:1}), Ll(c.tipo === 'mesa' ? 'Garcom: ' + U.nome : 'Cliente: ' + (c.cliente?.nome || '')), Ll(dataHora(agora())), HR];
  its.forEach(i => { L.push(Ll(`${i.qtd}x ${i.nome}`, {g:1, b:1})); (i.adicionais || []).forEach(a => L.push(Ll('   + ' + adTxt(a) + (i.qtd > 1 ? ' (em cada)' : ''), {b:1}))); if (i.obs) L.push(Ll('   OBS: ' + i.obs, {b:1})); });
  L.push(HR); return L;
}
function tkCancel(c, i, motivo){ return [Lc(DESTINOS[i.destino].toUpperCase(), {b:1}), Lc('*** CANCELADO ***', {g:1, b:1}), Lc(REF(c), {g:1, b:1}), Ll(dataHora(agora()) + '  por ' + U.nome), HR, Ll(`${i.qtd}x ${i.nome}`, {g:1, b:1}), ...(i.adicionais || []).map(a => Ll('   + ' + adTxt(a))), Ll('Motivo: ' + (motivo || '')), HR]; }
function agrupa(its){ const m = new Map(); its.forEach(i => { const k = i.nome + '|' + adsTxt(i.adicionais) + '|' + i.unit; const g = m.get(k); if (g) { g.qtd += i.qtd; g.total = r2(g.total + i.total); } else m.set(k, {nome:i.nome, adicionais:i.adicionais || [], unit:i.unit, qtd:i.qtd, total:i.total}); }); return [...m.values()]; }
function cab(){ const g = G(); const L = [Lc(g.nome.toUpperCase(), {b:1})]; if (g.endereco) L.push(Lc(g.endereco)); if (g.telefone) L.push(Lc(g.telefone)); return L; }
function linhasItensValor(its){ const L = []; agrupa(its).forEach(i => { L.push(KV(`${i.qtd}x ${i.nome}`, n2(i.total))); if (i.adicionais.length) L.push(Ll('   + ' + adsTxt(i.adicionais) + (i.qtd > 1 ? ' (em cada)' : ''))); if (i.qtd > 1) L.push(Ll(`   (${n2(i.unit)} cada)`)); }); return L; }
function tkTele(c, its, atualizado){
  const sub = r2(its.reduce((s, i) => s + i.total, 0)); const ent = c.tipo === 'tele' ? (+c.taxaEntrega || 0) : 0; const cl = c.cliente || {};
  const L = [...cab(), HR, Lc(REF(c), {g:1, b:1})]; if (atualizado) L.push(Lc('(PEDIDO ATUALIZADO)', {b:1}));
  L.push(Ll(dataHora(agora())), HR, Ll('Cliente: ' + (cl.nome || ''), {b:1}));
  if (cl.telefone) L.push(Ll('Fone: ' + fone(cl.telefone)));
  if (c.tipo === 'tele') { L.push(Ll('End.: ' + (cl.endereco || ''), {b:1})); L.push(Ll('Bairro: ' + (cl.bairro || '') + (cl.cidade ? ' - ' + cl.cidade : ''), {b:1})); }
  L.push(HR);
  its.forEach(i => { L.push(KV(`${i.qtd}x ${i.nome}`, n2(i.total), {b:1})); (i.adicionais || []).forEach(a => L.push(Ll('   + ' + adTxt(a) + (i.qtd > 1 ? ' (em cada)' : '')))); if (i.obs) L.push(Ll('   OBS: ' + i.obs)); });
  L.push(HR, KV('Subtotal', n2(sub))); if (ent) L.push(KV('Taxa de entrega', n2(ent)));
  L.push(KV('TOTAL', 'R$ ' + n2(sub + ent), {g:1, b:1}), HR);
  if (c.pagPrevisto) L.push(Ll('Pagamento: ' + c.pagPrevisto, {b:1})); if (+c.trocoPara) L.push(Ll('Troco para: R$ ' + n2(c.trocoPara) + '  (troco R$ ' + n2(+c.trocoPara - sub - ent) + ')', {b:1}));
  if (c.obsPedido) L.push(Ll('Obs.: ' + c.obsPedido, {b:1}));
  L.push(Lc('Nao e documento fiscal'));

}
function tkConta(c, its, f){
  const sub = r2(its.reduce((s, i) => s + i.total, 0));
  const L = [...cab(), HR, Lc(f ? 'CONTA - ' + REF(c) : 'PRE-CONTA - ' + REF(c), {g:1, b:1}), Ll(dataHora(agora()) + (c.garcom ? '  Garcom: ' + c.garcom : '')), HR, ...linhasItensValor(its), HR, KV('Subtotal', n2(f ? f.subtotal : sub))];
  if (f) { if (f.servico) L.push(KV(`Servico (${n2(f.servicoPct)}%)`, n2(f.servico))); if (f.entrega) L.push(KV('Taxa de entrega', n2(f.entrega))); if (f.desconto) L.push(KV('Desconto', '-' + n2(f.desconto)));

R.vendas = () => {
  const de = V.p.de || diaOp(), ate = V.p.ate || de;

  const soma = (l, f) => r2(l.reduce((s, x) => s + (+f(x) || 0), 0));
  const fat = soma(fe, c => c.total), serv = soma(fe, c => c.servico), desc = soma(fe, c => c.desconto), ent = soma(fe, c => c.entrega);
  const by = (l, kf, vf) => { const m = {}; l.forEach(x => { const k = kf(x); m[k] = r2((m[k] || 0) + (+vf(x) || 0)); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const pags = []; fe.forEach(c => (c.recebido || c.pagamentos || []).forEach(p => pags.push(p)));

  const porTipo = by(fe, c => tipos[c.tipo] || c.tipo, c => c.total); const nTipo = {}; fe.forEach(c => nTipo[tipos[c.tipo]] = (nTipo[tipos[c.tipo]] || 0) + 1);

  const top = Object.values(prod).sort((a, b) => b.v - a.v);

  const porTipoProd = by(its, i => { const pr = S.produtos.find(x => x.id === i.produtoId); return pr && typeof tipoCustoProd === 'function' && tipoCustoProd(pr) === 'bebidas' ? 'Bebidas' : 'Alimentos'; }, i => i.total);
  const porGar = by(fe.filter(c => c.tipo === 'mesa'), c => c.garcom || '—', c => c.subtotal);
  const svGar = by(fe.filter(c => c.tipo === 'mesa'), c => c.garcom || '—', c => c.servico);
  const tab = (t, rows, extra) => { const base = rows.reduce((s, r) => s + r[1], 0); return `<div class="card"><div class="pad" style="padding-bottom:6px"><h3 style="font-size:18px">${t}</h3></div><table class="t"><tbody>${rows.map(([k, v]) => `<tr><td>${esc(k)}${extra ? `<span class="muted small"> ${extra(k)}</span>` : ''}</td><td class="r num"><b>${brl(v)}</b></td><td class="r small muted num" style="width:64px">${base ? n2(v / base * 100) + '%' : ''}</td></tr>`).join('')}</tbody></table></div>`; };

function papel(linhas, col = 42){
  const wrap = (s, w) => { const o = []; String(s).split('\n').forEach(p => { while (p.length > w) { let k = p.lastIndexOf(' ', w); if (k < w * .5) k = w; o.push(p.slice(0, k)); p = p.slice(k).trimStart(); } o.push(p); }); return o; };
  return (linhas || []).map(l => { if (l.hr) return '-'.repeat(col); if (l.feed) return '\n'.repeat(l.feed - 1); const w = l.g ? Math.floor(col / 2) : col; let out;
    if (l.kv) { const [a, b] = l.kv.map(String); out = a.length + b.length + 1 > w ? [...wrap(a, w), ' '.repeat(Math.max(0, w - b.length)) + b] : [a + ' '.repeat(w - a.length - b.length) + b]; }
    else out = wrap(l.s || '', w).map(x => l.a === 'c' ? ' '.repeat(Math.max(0, Math.floor((w - x.length) / 2))) + x : l.a === 'r' ? x.padStart(w) : x);
    const cls = [l.g ? 'g' : '', l.b ? 'b' : ''].join(' ').trim(); return out.map(x => cls ? `<span class="${cls}">${esc(x)}</span>` : esc(x)).join('\n'); }).join('\n');
}
function verImp(id){ const i = S.impressoes.find(x => x.id === id); if (!i) return; const p = IMPR()[i.destino] || {};
  abrirModal(`<div class="mh"><h3>${DESTINOS[i.destino]} · ${esc(i.ref || '')}</h3><button class="btn sm ghost" data-a="fecharModal">✕</button></div><div class="mb" style="background:var(--surface-2)"><div class="paper">${papel(i.linhas, Math.min(48, +p.colunas || 48))}</div></div><div class="mf"><button class="btn" data-a="fecharModal">Fechar</button>${i.status === 'cancelado' ? '' : `<button class="btn pri" data-a="reimp" data-id="${i.id}">${i.status === 'impresso' ? 'Reimprimir (2ª via)' : i.status === 'pendente' || i.status === 'imprimindo' ? 'Já está na fila' : 'Tentar de novo'}</button>`}</div>`, 'wide'); }
async function reimp(id){
  const i = S.impressoes.find(x => x.id === id); if (!i) return; fecharModal();
  if (i.status === 'pendente' || i.status === 'imprimindo') return toast('Já está na fila: sai assim que o programa de impressão conectar');
  if (i.status === 'erro' || i.status === 'expirado') return gravar([{op:'update', col:'impressoes', id, data:{status:'pendente', tentativas:0, erro:null, criadoEm:agora(), reenviadoPor:U.nome, reenviadoEm:agora()}}], 'Colocado de novo na fila');
  const linhas = [Lc('*** 2a VIA ***', {b:1}), ...(i.linhas || []).filter(l => l.s !== '*** 2a VIA ***')];
  const nj = job(i.destino, i.tipo, i.ref, linhas, i.envio); nj.data.segundaVia = true; nj.data.origem = i.origem || i.id;
  await gravar([nj], '2ª via enviada');
}
async function cancImp(id){

function opsReceitaVenda(c, f, its){
  const fin = FIN(); const dia = diaOp(); const ops = [];

  if (!its || !its.length) porConta[contaCanal] = sub;

    const cfg = fin.formas[p.forma] || {taxa:0, prazo:0, banco:'banco'};
    const parte = v => Math.round(v * p.valor / bruto * 100) / 100;

function filtroLanc(tipo){

  if (st === 'abertos') l = l.filter(x => x.status !== 'pago' && (x.vencimento <= mes + '-31'));
  else if (st === 'vencidos') l = l.filter(x => stLanc(x) === 'vencido');
  else if (st === 'pagos') l = l.filter(x => x.status === 'pago' && mesDe(x.pagoEm) === mes);
  else l = l.filter(x => mesDe(x.vencimento) === mes);
  if (b) l = l.filter(x => semAcento([x.desc, x.pessoa, nomeConta(x.conta), x.doc, x.forma].join(' ')).includes(b));
  return l.sort((a, b2) => (a.vencimento || '') < (b2.vencimento || '') ? -1 : 1);
}

/* ---------- boleto: linha digitável → valor e vencimento ---------- */
function lerLinhaDigitavel(txt){
  const d = String(txt || '').replace(/\D/g, '');
  if (d.length === 47) { // boleto bancário
    const fator = +d.slice(33, 37), valor = +d.slice(37, 47) / 100; let venc = '';
    if (fator) { const a = new Date(1997, 9, 7); a.setDate(a.getDate() + fator); const b = new Date(2025, 1, 22); b.setDate(b.getDate() + fator - 1000);
      const ref = Date.now(); venc = diaStr(Math.abs(a - ref) < Math.abs(b - ref) ? a : b); }
    return {tipo:'Boleto bancário', valor, vencimento:venc};
  }
  if ((d.length === 48 || d.length === 44) && d[0] === '8') { // contas de consumo e tributos
    const cod = d.length === 48 ? d.slice(0, 11) + d.slice(12, 23) + d.slice(24, 35) + d.slice(36, 47) : d;
    const real = ['6', '7'].includes(cod[2]); const valor = real ? +cod.slice(4, 15) / 100 : 0;
    return {tipo:'Conta de consumo / tributo', valor, vencimento:''};
  }
  return null;
}

/* ---------- anexo: guarda a imagem comprimida (ou o PDF pequeno) junto do lançamento ---------- */
function prepararAnexo(file){
  return new Promise((ok, erro) => {
    const fr = new FileReader();
    fr.onerror = erro;
    fr.onload = () => {
      if (file.type === 'application/pdf') { const s = String(fr.result); return s.length < 900000 ? ok({nome:file.name, mime:file.type, dados:s}) : ok(null); }
      const img = new Image(); img.onerror = () => ok(null);
      img.onload = () => { const m = 1400, k = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let q = 0.7, s = c.toDataURL('image/jpeg', q); while (s.length > 850000 && q > 0.3) { q -= 0.1; s = c.toDataURL('image/jpeg', q); }
        ok(s.length < 900000 ? {nome:file.name, mime:'image/jpeg', dados:s} : null); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- leitura automática com IA (Google Gemini, chave do próprio cliente) ---------- */
/* chamada genérica ao Gemini com um arquivo (foto/PDF) e um pedido; devolve o JSON da resposta */
async function chamarGemini(prompt, file){
  const cfg = S.ia || {}; if (!cfg.chave) throw new Error('Leitura automática ainda não configurada: informe a chave em Configurações › Leitura automática de documentos.');
  const b64 = await new Promise((ok, erro) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = erro; fr.readAsDataURL(file); });
  const modelo = (cfg.modelo || 'gemini-flash-latest').trim(); let r;
  try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:generateContent?key=${encodeURIComponent(cfg.chave.trim())}`, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}, {inline_data:{mime_type:file.type || 'image/jpeg', data:b64}}]}], generationConfig:{responseMimeType:'application/json', temperature:0}})}); }
  catch (e) { throw new Error('Sem conexão com o serviço de leitura. Verifique a internet.'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch {} throw new Error(r.status === 400 && /API key/i.test(m) ? 'A chave da leitura automática é inválida. Confira em Configurações.' : r.status === 404 ? `Modelo "${modelo}" não encontrado. Ajuste o modelo em Configurações.` : r.status === 429 ? 'Limite gratuito de leituras atingido por agora. Tente em alguns minutos.' : 'Falha na leitura (' + r.status + '): ' + m.slice(0, 140)); }
  const j = await r.json(); const txt = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join('').replace(/^```(json)?|```$/g, '').trim();
  try { return JSON.parse(txt); } catch (e) { throw new Error('Não consegui entender o documento. Tente uma foto mais nítida.'); }
}

  const contas = PLANO().filter(g => SECOES[g.secao].nat === 'P').flatMap(g => g.contas.filter(c => c.ativo !== false && c.id !== 'd_taxas').map(c => c.nome));
  const prompt = `Você é assistente financeiro de um restaurante no Brasil. Leia o documento (conta de consumo, boleto, nota fiscal, recibo ou fatura) e responda SOMENTE com um JSON neste formato:
{"fornecedor": "nome da empresa que cobra (ex.: RGE, Corsan, Vivo, nome do contador)", "cnpj": "CNPJ do fornecedor ou vazio", "descricao": "descrição curta, ex.: Energia elétrica 10/2026", "valor": número total a pagar em reais (ex.: 1234.56), "vencimento": "AAAA-MM-DD ou vazio", "emissao": "AAAA-MM-DD ou vazio", "referencia": "AAAA-MM do mês de consumo/competência ou vazio", "documento": "número da nota/fatura ou vazio", "linha_digitavel": "somente os números do código de barras/linha digitável, se aparecer", "parcelas": [{"vencimento":"AAAA-MM-DD","valor":número}] (as duplicatas/fatura da nota, se houver mais de uma), "conta": "escolha EXATAMENTE um nome desta lista de contas: ${contas.join(' | ')}"}
Use ponto como separador decimal no valor. Não invente dados: deixe vazio o que não estiver legível.`;

/* ---------- períodos (igual ao Truckcar): mês, trimestre, semestre, ano, de/até ---------- */
const MESES_L = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DREF = {soValor:false, ano:new Date().getFullYear(), reg:'comp', per:{tipo:'ano', mes:new Date().getMonth(), tri:Math.floor(new Date().getMonth() / 3), sem:Math.floor(new Date().getMonth() / 6), de:0, ate:new Date().getMonth()}, av:false, ah:false, abertos:Object.fromEntries(Object.keys(SECOES).map(k => [k, 1]))};
function faixa(P){ if (P.tipo === 'per') { const a = P.de ?? 0, b = P.ate ?? 11; return [Math.min(a, b), Math.max(a, b)]; } if (P.tipo === 'mes') return [P.mes, P.mes]; if (P.tipo === 'tri') return [P.tri * 3, P.tri * 3 + 2]; if (P.tipo === 'sem') return [P.sem * 6, P.sem * 6 + 5]; return [0, 11]; }
function rotuloPer(P, ano){ const [a, b] = faixa(P); if (P.tipo === 'per') return a === b ? MESES_L[a] + '/' + ano : MESES[a] + ' a ' + MESES[b] + '/' + ano; if (P.tipo === 'mes') return MESES_L[a] + '/' + ano; if (P.tipo === 'tri') return (P.tri + 1) + 'º trimestre/' + ano; if (P.tipo === 'sem') return (P.sem + 1) + 'º semestre/' + ano; return 'Ano ' + ano; }

/* valores por conta e mês; regime de competência (data de competência) ou de caixa (só baixados, pela data da baixa) */
let DRE_DET = null;
function valoresDRE(ano, reg = 'comp'){
  const m = {}, det = {}; const caixa = reg === 'caixa';
  const add = (conta, mi, v, l) => { if (!v) return; (m[conta] = m[conta] || Array(12).fill(0))[mi] += v; ((det[conta] = det[conta] || {})[mi] = det[conta][mi] || []).push({l, v}); };
  S.lancamentos.forEach(l => { const data = caixa ? (l.status === 'pago' ? l.pagoEm : null) : l.competencia; if (!data || data.slice(0, 4) !== String(ano)) return; const mi = +data.slice(5, 7) - 1;
    if (l.origem === 'venda') { Object.entries(l.rateio || {}).forEach(([c, v]) => add(c, mi, +v || 0, l)); add('d_taxas', mi, taxaLanc(l), l); return; }
    add(l.conta, mi, +l.valor || 0, l); if (l.tipo === 'R' && taxaLanc(l)) add('d_taxas', mi, taxaLanc(l), l);
    if (l.status === 'pago' && l.diferenca) { if (l.tipo === 'P') add(l.diferenca > 0 ? '_juros' : '_descObtido', mi, Math.abs(l.diferenca), l); else add(l.diferenca > 0 ? '_jurosRec' : '_descConcedido', mi, Math.abs(l.diferenca), l); }
  });
  DRE_DET = det; return m;
}

  const frec = somaC(secIds('fin_rec')), fdes = somaC(secIds('fin_desp')), ir = somaC(secIds('ir')), nop = somaC(secIds('nao_op')), dis = somaC(secIds('distrib'));
  const rl = op(rec, ded), lb = op(op(rl, cmv), per), ro = op(lb, dop), lair = op(op(ro, frec, 1), fdes), ll = op(lair, ir), rf = op(op(ll, nop), dis);

async function reorganizarPlano(){

async function organizarReceitas(){
  const usa = id => S.lancamentos.some(l => (l.origem !== 'venda' && l.conta === id) || (l.rateio && l.rateio[id] != null));
  const G0 = PLANO(); const cats = G0.filter(g => g.secao === 'receita').flatMap(g => g.contas).filter(c => String(c.id).startsWith('rc'));
  const destCat = c => { const ps = S.produtos.filter(p => semAcento(p.categoria) === semAcento(c.nome)); const nb = ps.filter(p => tipoCustoProd(p) === 'bebidas').length; return ps.length && nb > ps.length / 2 ? 'r_beb' : (/bebid|cervej|drink|caipir|vinho|espumant|chopp|refri/.test(semAcento(c.nome)) ? 'r_beb' : 'r_alim'); };
  const mapa = {}; cats.forEach(c => mapa[c.id] = destCat(c));

  const lancs = S.lancamentos.filter(l => l.rateio && Object.keys(l.rateio).some(k => mapa[k] || CAN.includes(k)));
  /* vendas antigas lançadas por canal: divide entre alimentos e bebidas pela proporção dos produtos vendidos no dia */
  const prop = {}; for (const dia of [...new Set(lancs.filter(l => Object.keys(l.rateio).some(k => CAN.includes(k))).map(l => l.competencia))]) {
    let cs = []; try { cs = await ST.get('comandas', [['diaFech', '==', dia]]); } catch (e) {}
    let al = 0, be = 0; cs.filter(c => c.status === 'fechada').forEach(c => (c.itensResumo || []).forEach(i => { const pr = S.produtos.find(x => x.id === i.produtoId); if ((pr ? tipoCustoProd(pr) : 'insumos') === 'bebidas') be += +i.total || 0; else al += +i.total || 0; }));
    prop[dia] = al + be ? be / (al + be) : 0; }
  if (!confirm(`Organizar as receitas da DRE?\n\n• Vendas de produtos: Vendas de alimentos e Vendas de bebidas\n• Outras receitas operacionais: taxa de serviço, taxa de entrega, outras\n• Mesas, tele e retirada saem da DRE (continuam no relatório de vendas)${lancs.length ? `\n• ${lancs.length} lançamento(s) de vendas já feitos passam para alimentos/bebidas (as vendas antigas por mesa/tele/retirada são divididas pela proporção dos produtos vendidos no dia)` : ''}`)) return;
  const ops2 = lancs.map(l => { const r = {}; Object.entries(l.rateio).forEach(([k, v]) => { v = +v || 0; if (CAN.includes(k)) { const fb = prop[l.competencia] || 0; const vb = r2(v * fb); r.r_beb = r2((r.r_beb || 0) + vb); r.r_alim = r2((r.r_alim || 0) + v - vb); return; } const d = mapa[k] || k; r[d] = r2((r[d] || 0) + v); }); const d = Object.assign({}, l, {rateio:r}); delete d.id; return {op:'set', col:'lancamentos', id:l.id, data:d}; });

    const outras = ['r_servico', 'r_entrega', 'r_outras'].map(id => pega(id) || {id, nome:{r_servico:'Taxa de serviço (10%)', r_entrega:'Taxa de entrega', r_outras:'Outras receitas'}[id], ativo:true});
    const extras = todas.filter(c => !['r_alim', 'r_beb', 'r_servico', 'r_entrega', 'r_outras', 'r_salao', 'r_tele', 'r_retirada', 'd_taxas'].includes(c.id) && !mapa[c.id]);
    const canais = ['r_salao', 'r_tele', 'r_retirada'].map(pega).filter(Boolean).filter(c => S.lancamentos.some(l => !lancs.includes(l) && ((l.origem !== 'venda' && l.conta === c.id) || (l.rateio && l.rateio[c.id] != null)))).map(c => Object.assign(c, {ativo:false}));
    const gV = {id:(rec[0] || {}).id || 'g' + uid(), secao:'receita', nome:'Vendas de produtos', contas:[pega('r_alim') || {id:'r_alim', nome:'Vendas de alimentos', ativo:true}, pega('r_beb') || {id:'r_beb', nome:'Vendas de bebidas', ativo:true}, ...canais]};
    const gO = {id:'g' + uid(), secao:'receita', nome:'Outras receitas operacionais', contas:[...outras, ...extras]};
    const i = g.findIndex(x => x.secao === 'receita'); const resto = g.filter(x => x.secao !== 'receita'); g.length = 0; resto.forEach((x, k) => { if (k === Math.max(0, i)) { g.push(gV, gO); } g.push(x); }); if (!g.includes(gV)) g.unshift(gV, gO);

async function backup(){
  toast('Gerando backup…'); const cols = ['produtos','adicionais','clientes','comandas','itens','lancamentos','fornecedores','insumos','receitas','anexos','config','usuarios'];
  const out = {sistema:'ERP Parada Obrigatória', versao:VERSAO, geradoEm:agora(), por:U.nome, dados:{}};
  for (const c of cols) { try { out.dados[c] = await ST.get(c); } catch (e) { out.dados[c] = {erro:e.code || e.message}; } }
  const blob = new Blob([JSON.stringify(out)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup-parada-obrigatoria-${hoje()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);

}

/* produtos vendidos num dia (abertura das vendas do contas a receber) com custo e margem */
async function produtosDoDia(dia){
  toast('Carregando…'); let cs = []; try { cs = await ST.get('comandas', [['diaFech', '==', dia]]); } catch (e) { return toast('Erro ao carregar: ' + (e.code || e.message), 1); }
  cs = cs.filter(c => c.status === 'fechada'); const m = {};
  cs.forEach(c => (c.itensResumo || []).forEach(i => { const p = S.produtos.find(x => x.id === i.produtoId); const k = i.nome; const o = m[k] = m[k] || {nome:i.nome, tipo:p ? tipoCustoProd(p) : 'insumos', cat:i.categoria, q:0, v:0, c:0};
    o.q += i.qtd; o.v = r2(o.v + i.total); o.c = r2(o.c + (p ? custoProduto(p).custo : 0) * i.qtd); }));
  const ls = Object.values(m).sort((a, b) => a.tipo.localeCompare(b.tipo) || b.v - a.v); const tv = ls.reduce((s, x) => s + x.v, 0);
  const bloco = t => { const l = ls.filter(x => x.tipo === t); if (!l.length) return ''; const v = l.reduce((s, x) => s + x.v, 0), c = l.reduce((s, x) => s + x.c, 0);
    return `<tr class="cat"><td colspan="2">${t === 'bebidas' ? 'Bebidas' : 'Alimentos'}</td><td class="r num">${l.reduce((s, x) => s + x.q, 0)}</td><td class="r num">${brl(v)}</td><td class="r num">${brl(c)}</td><td class="r num">${v ? n2(c / v * 100) + '%' : ''}</td><td class="r num">${brl(v - c)}</td></tr>` +
      l.map(x => `<tr><td><b>${esc(x.nome)}</b></td><td class="small muted">${esc(x.cat || '')}</td><td class="r num">${x.q}</td><td class="r num">${brl(x.v)}</td><td class="r num">${x.c ? brl(x.c) : '<span class="muted small">sem custo</span>'}</td><td class="r num" style="${x.c / x.v > FIN().metaCMV / 100 ? 'color:var(--red)' : ''}">${x.c ? n2(x.c / x.v * 100) + '%' : ''}</td><td class="r num">${x.c ? brl(x.v - x.c) : ''}</td></tr>`).join(''); };
  abrirModal(`<div class="mh"><h3>Produtos vendidos · ${dataBR(dia)}</h3><button class="btn sm ghost" data-a="fecharModal">✕</button></div><div class="mb">
    <p class="small muted" style="margin-top:0">${cs.length} venda(s) fechada(s) no dia · ${brl(tv)} em produtos (sem serviço, entrega e descontos). Custo pelas fichas técnicas e custos de compra atuais.</p>
    ${ls.length ? `<div class="tw"><table class="t"><thead><tr><th>Produto</th><th>Categoria</th><th class="r">Qtde</th><th class="r">Vendas</th><th class="r">Custo</th><th class="r">CMV</th><th class="r">Margem bruta</th></tr></thead><tbody>${bloco('insumos')}${bloco('bebidas')}</tbody></table></div>` : '<div class="empty">Nenhuma venda com produtos neste dia.</div>'}</div>`, 'wide');
}

async function importarFichas(){
  // importa só o que ainda não existe (pelo nome) — pode ser usada de novo quando o cardápio ganhar pratos
  const E = ESTR_FICHAS; const k = semAcento; const ts = agora(); const ops = [];
  const mapI = {}, mapS = {}; S.insumos.forEach(i => mapI[k(i.nome)] = i.id); sps().forEach(s => mapS[k(s.nome)] = s.id);
  const novosI = E.insumos.filter(i => !mapI[k(i.nome)]), novosS = E.sps.filter(s => !mapS[k(s.nome)]);
  const ftNomes = new Set(fts().map(f => k(f.nome))); const ligados = new Set(fts().map(f => f.produtoId).filter(Boolean));
  const novosF = E.fts.filter(f => !ftNomes.has(k(f.nome)) && !S.produtos.some(p => k(p.nome) === k(f.nome) && ligados.has(p.id)));
  if (!novosI.length && !novosS.length && !novosF.length) return toast('Tudo da planilha já está cadastrado');
  if (!confirm(`Importar da planilha de fichas técnicas o que ainda falta:\n• ${novosI.length} insumos\n• ${novosS.length} subprodutos\n• ${novosF.length} fichas técnicas${S.produtos.length ? '' : '\n\nATENÇÃO: o cardápio ainda não foi importado em Produtos; as fichas ficarão sem prato ligado.'}\n\nO que você já cadastrou não é alterado.`)) return;
  novosI.forEach(i => { const id = uid(); mapI[k(i.nome)] = id; ops.push({op:'set', col:'insumos', id, data:{nome:i.nome, unid:i.unid || 'kg', preco:+i.preco || 0, bruto:+i.bruto || 1, liquido:+i.liquido || 0, fornecedor:i.fornecedor || '', grupo:i.grupo || '', criadoEm:ts, atualizadoEm:ts, origem:'planilha'}}); });
  novosS.forEach(s => mapS[k(s.nome)] = uid());
  const ref = n => { const x = k(n); return mapI[x] ? 'i:' + mapI[x] : mapS[x] ? 's:' + mapS[x] : ''; };
  const itens = l => l.map(it => ({ref:ref(it.nome), qtd:+it.qtd || 0, obs:it.obs || ''})).filter(it => it.ref);
  novosS.forEach(s => ops.push({op:'set', col:'receitas', id:mapS[k(s.nome)], data:{tipo:'sp', nome:s.nome, rend:+s.rend || 0, unid:'kg', itens:itens(s.itens), modo:s.modo || '', criadoEm:ts, origem:'planilha'}}));
  let lig = 0; novosF.forEach(f => { const p = S.produtos.find(x => k(x.nome) === k(f.nome) && !ligados.has(x.id)); if (p) lig++;
    ops.push({op:'set', col:'receitas', id:uid(), data:{tipo:'ft', nome:f.nome, produtoId:p ? p.id : '', rend:+f.rend || 1, unid:'porção', itens:itens(f.itens), modo:f.modo || '', criadoEm:ts, origem:'planilha'}}); });

function lerArquivoPrecos(file){

  fr.onload = () => { let j; try { j = JSON.parse(fr.result); } catch (e) { return toast('Arquivo inválido: não é um arquivo de preços', 1); }
    const its = Array.isArray(j) ? j : (j.itens || []); if (!its.length && !(j.fornecedores || []).length && !(j.lancamentos || []).length) return toast('O arquivo não tem itens', 1); previaPrecos(its, Array.isArray(j) ? {} : j); };
  fr.readAsText(file);
}

    const i = S.insumos.find(q => k(q.nome) === k(x.insumo || '')); return {n, tipo:'insumo', x, alvo:i, atual:i ? +i.preco || 0 : null, novo:+x.preco || 0};

      ${linhas.length ? `<h3 style="font-size:17px;margin:14px 0 6px">Preços de insumos e produtos (${linhas.length})</h3><div class="tw"><table class="t"><thead><tr><th></th><th>Item</th><th>Fornecedor / origem</th><th class="r">Atual</th><th class="r">Novo</th><th class="r">Variação</th></tr></thead><tbody>

async function lerNotaCompra(file){
  toast('Lendo a nota… (alguns segundos)');
  const ins = [...S.insumos].sort((a, b) => a.nome.localeCompare(b.nome)).map(i => `${i.nome} [${i.unid}]`);
  const rev = S.produtos.filter(p => p.tipo === 'Revenda').map(p => p.nome);
  const contas = PLANO().filter(g => ['cmv', 'deducoes', 'desp_op'].includes(g.secao)).flatMap(g => g.contas.filter(c => c.ativo !== false && c.id !== 'd_taxas').map(c => c.nome));
  const prompt = `Você é assistente financeiro de um restaurante no Brasil. Leia esta nota fiscal/pedido de compra e responda SOMENTE com JSON:
{"fornecedor":"razão social ou nome fantasia do emitente","cnpj":"","telefone":"só números","numero":"número da nota ou pedido","emissao":"AAAA-MM-DD","total":número,
 "parcelas":[{"vencimento":"AAAA-MM-DD","valor":número}],
 "conta":"escolha EXATAMENTE um destes nomes de conta para a compra: ${contas.join(' | ')}",
 "itens":[{"descricao":"como está na nota","quantidade":número,"unidade":"como está na nota","valor_unitario":número,"valor_total":número,
   "insumo":"nome EXATO de um insumo desta lista que corresponde ao item, ou vazio","produto":"nome EXATO de um produto de revenda desta lista, ou vazio",
   "preco_por_unidade_do_insumo":número (converta para a unidade do insumo entre colchetes: ex. pacote de 2 kg a 28,40 → 14,20 por kg; lata 1,7 kg a 16,99 → 9,99 por kg; se o insumo é [un] use o preço da unidade)}]}
Insumos: ${ins.join('; ')}
Produtos de revenda: ${rev.join('; ') || '(nenhum)'}
Se não houver fatura/parcelas, use uma parcela com o total e o vencimento que aparecer (ou a data de emissão). Use ponto como separador decimal. Não invente dados.`;
  let r; try { r = await chamarGemini(prompt, file); } catch (e) { toast(e.message, 1); return; }
  const forn = (r.fornecedor || '').trim() || 'Fornecedor';
  const ex = S.fornecedores.find(f => (r.cnpj && String(f.doc || '').replace(/\D/g, '') === String(r.cnpj).replace(/\D/g, '')) || semAcento(f.nome) === semAcento(forn));
  const nomeF = ex ? ex.nome : forn; const doc = r.numero ? 'NF ' + r.numero : '';
  const itens = (r.itens || []).map(it => { const base = {fornecedor:nomeF, data:r.emissao || hoje(), origem:doc, obs:`${it.descricao || ''} · ${it.quantidade || ''} ${it.unidade || ''} × ${n2(it.valor_unitario)}`};
    if (it.produto && S.produtos.some(p => p.nome === it.produto)) return Object.assign(base, {produto:it.produto, custo:+it.preco_por_unidade_do_insumo || +it.valor_unitario || 0});
    if (it.insumo && S.insumos.some(i => i.nome === it.insumo)) return Object.assign(base, {insumo:it.insumo, preco:+it.preco_por_unidade_do_insumo || +it.valor_unitario || 0, unid:(S.insumos.find(i => i.nome === it.insumo) || {}).unid});
    return Object.assign(base, {insumo:(it.descricao || 'Item').trim(), preco:+it.valor_unitario || 0, unid:'un', sugestao:true}); });
  const parc = (r.parcelas || []).filter(p => +p.valor > 0); const n = parc.length;
  const lancamentos = parc.map((p, k) => ({fornecedor:nomeF, doc, desc:`Compra ${nomeF}${doc ? ' ' + doc : ''}`, conta:r.conta || '', valor:+p.valor, competencia:r.emissao || hoje(), vencimento:p.vencimento || r.emissao || hoje(), parcela: n > 1 ? `${k + 1}/${n}` : ''}));
  previaPrecos(itens, {descricao:`${nomeF}${doc ? ' · ' + doc : ''}`, fornecedores: ex ? [] : [{nome:forn, doc:r.cnpj || '', telefone:r.telefone || '', categoria:''}], lancamentos});
}
